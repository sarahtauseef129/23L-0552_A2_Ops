
name: VisionGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff \
            "SQLAlchemy>=2.0,<3.0" \
            "psycopg[binary]>=3.2,<4.0" \
            python-dotenv

      - name: Check Python syntax
        run: |
          python -m py_compile app.py inference.py database.py
          python -m py_compile tests/test_database.py

      - name: Run linting
        run: |
          ruff check app.py inference.py database.py tests/ \
            --select E4,E7,E9,F63,F7,F82

      - name: Run automated tests
        run: python -m pytest tests/ -v

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build VisionGuard Docker image
        run: |
          docker build -t visionguard:ci .
