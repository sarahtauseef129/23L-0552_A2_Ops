
services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10

    # Intentionally NO ports section.
    # PostgreSQL is private to the Compose network.

  web:
    build:
      context: .
      dockerfile: Dockerfile

    image: visionguard:compose
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
     # MODEL_PATH: /app/models/missing_model.keras
      MODEL_PATH: /app/models/mobilenet_tuned_best.keras
      FLASK_DEBUG: "false"

    ports:
      - "127.0.0.1:5001:5001"

    volumes:
      - type: bind
        source: ./models
        target: /app/models
        read_only: true

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
